[project]
name = "financial-doc-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rakebul Hasan", email = "rhasan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-client>=3.3.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "dagster>=1.13.18",
    "dagster-webserver>=1.13.18",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "uvicorn>=0.34.0",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.98.0",
    "markdownify>=1.2.3",
    "mcp>=2.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
financial-doc-ai = "financial_doc_ai:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "vcrpy>=8.3.0",
]

[tool.dagster]
module_name = "financial_doc_ai.ingestion.definitions"
