services:
  app:
    build:
      context: ../..
      dockerfile: infra/serving/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
      - /app/.venv
    env_file:
      - ../../.env
    environment:
      # Retrieval MCP server (its own stack) reachable by container name on llm-net.
      SEARCH_MCP_URL: http://retrieval-app-1:8001/mcp
    networks:
      - llm-net

networks:
  llm-net:
    external: true
