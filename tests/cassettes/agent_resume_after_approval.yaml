      Returns the most\\n    relevant passages, each with the citation metadata needed
      to attribute it.\\n    \",\"parameters\":{\"type\":\"object\",\"properties\":{\"query\":{\"type\":\"string\"},\"company\":{\"default\":null,\"anyOf\":[{\"items\":{\"type\":\"string\"},\"type\":\"array\"},{\"type\":\"null\"}]},\"doc_type\":{\"default\":null,\"anyOf\":[{\"items\":{\"type\":\"string\"},\"type\":\"array\"},{\"type\":\"null\"}]},\"period\":{\"default\":null,\"anyOf\":[{\"items\":{\"type\":\"string\"},\"type\":\"array\"},{\"type\":\"null\"}]},\"version\":{\"default\":\"current\",\"type\":\"string\"},\"top_k\":{\"default\":5,\"type\":\"integer\"}},\"required\":[\"query\"],\"additionalProperties\":false}}},{\"type\":\"function\",\"function\":{\"name\":\"graph_search\",\"description\":\"Graph-based
