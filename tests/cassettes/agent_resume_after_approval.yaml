        Ernst & Young LLP  \\nWe have served as Apple Inc.\\u2019s auditor since 2009.
        \ \\nSan Jose, California  \\nNovember2, 2023  \\nReport of Independent Registered
        Public Accounting Firm  \\nTo the Shareholders and the Board of Directors
        of Apple Inc.  \\nOpinion on Internal Control Over Financial Reporting  \\nWe
        have audited Apple Inc.\\u2019s internal control over financial reporting
        as of September30, 2023, based on criteria established in Internal Control
        \\u2013 Integrated Framework issued by the Committee of Sponsoring Organizations
        of the Treadway Commission (2013 framework) (the \\u201cCOSO criteria\\u201d).
        In our opinion, Apple Inc. maintained, in all material respects, effective
        internal control over financial reporting as of September30, 2023, based on
        the COSO criteria.  \\nWe also have audited, in accordance with the standards
        of the Public Company Accounting Oversight Board (United States) (the \\u201cPCAOB\\u201d),
        the consolidated balance sheets of Apple Inc. as of September30, 2023 and
        September24, 2022, the related consolidated statements of operations, comprehensive
        income, shareholders\\u2019 equity and cash flows for each of the three years
        in the period ended September30, 2023, and the related notes and our report
        dated November2, 2023 expressed an unqualified opinion thereon.  \\nBasis
        for Opinion  \\nApple Inc.\\u2019s management is responsible for maintaining
        effective internal control over financial reporting, and for its assessment
        of the effectiveness of internal control over financial reporting included
        in the accompanying Management\\u2019s Annual Report on Internal Control over
        Financial Reporting. Our responsibility is to express an opinion on Apple
        Inc.\\u2019s internal control over financial reporting based on our audit.
        We are a public accounting firm registered with the PCAOB and are required
        to be independent with respect to Apple Inc. in accordance with the U.S. federal
        securities laws and the applicable rules and regulations of the U.S. Securities
        and Exchange Commission and the PCAOB.  \\nWe conducted our audit in accordance
        with the standards of the PCAOB. Those standards require that we plan and
        perform the audit to obtain reasonable assurance about whether effective internal
        control over financial reporting was maintained in all material respects.
        \ \\nOur audit included obtaining an understanding of internal control over
        financial reporting, assessing the risk that a material weakness exists, testing
        and evaluating the design and operating effectiveness of internal control
        based on the assessed risk, and performing such other procedures as we considered
        necessary in the circumstances. We believe that our audit provides a reasonable
        basis for our opinion.  \\nDefinition and Limitations of Internal Control
        Over Financial Reporting  \\nA company\\u2019s internal control over financial
        reporting is a process designed to provide reasonable assurance regarding
        the reliability of financial reporting and the preparation of financial statements
        for external purposes in accordance with U.S. generally accepted accounting
        principles. A company\\u2019s internal control over financial reporting includes
        those policies and procedures that (1)pertain to the maintenance of records
        that, in reasonable detail, accurately and fairly reflect the transactions
        and dispositions of the assets of the company; (2)provide reasonable assurance
        that transactions are recorded as necessary to permit preparation of financial
        statements in accordance with U.S. generally accepted accounting principles,
        and that receipts and expenditures of the company are being made only in accordance
        with authorizations of management and directors of the company; and (3)provide
        reasonable assurance regarding prevention or timely detection of unauthorized
        acquisition, use, or disposition of the company\\u2019s assets that could
        have a material effect on the financial statements.  \\nBecause of its inherent
        limitations, internal control over financial reporting may not prevent or
        detect misstatements. Also, projections of any evaluation of effectiveness
        to future periods are subject to the risk that controls may become inadequate
        because of changes in conditions, or that the degree of compliance with the
        policies or procedures may deteriorate.  \\n/s/ Ernst & Young LLP  \\nSan
        Jose, California  \\nNovember2, 2023  \\nItem 9.Changes in and Disagreements
        with Accountants on Accounting and Financial Disclosure  \\nNone.  \\nItem
        9A.Controls and Procedures  \\nEvaluation of Disclosure Controls and Procedures
        \ \\nBased on an evaluation under the supervision and with the participation
        of the Company\\u2019s management, the Company\\u2019s principal executive
        officer and principal financial officer have concluded that the Company\\u2019s
        disclosure controls and procedures as defined in Rules 13a-15(e) and 15d-15(e)
        under the Exchange Act were effective as of September30, 2023 to provide reasonable
        assurance that information required to be disclosed by the Company in reports
        that it files or submits under the Exchange Act is (i)recorded, processed,
        summarized and reported within the time periods specified in the SEC rules
        and forms and (ii)accumulated and communicated to the Company\\u2019s management,
        including its principal executive officer and principal financial officer,
        as appropriate to allow timely decisions regarding required disclosure.  \\nInherent
        Limitations over Internal Controls  \\nThe Company\\u2019s internal control
        over financial reporting is designed to provide reasonable assurance regarding
        the reliability of financial reporting and the preparation of financial statements
        for external purposes in accordance with GAAP. The Company\\u2019s internal
        control over financial reporting includes those policies and procedures that:
        \ \\n(i)pertain to the maintenance of records that, in reasonable detail,
        accurately and fairly reflect the transactions and dispositions of the Company\\u2019s
        assets;  \\n(ii)provide reasonable assurance that transactions are recorded
        as necessary to permit preparation of financial statements in accordance with
        GAAP, and that the Company\\u2019s receipts and expenditures are being made
        only in accordance with authorizations of the Company\\u2019s management and
        directors; and  \\n(iii)provide reasonable assurance regarding prevention
        or timely detection of unauthorized acquisition, use, or disposition of the
        Company\\u2019s assets that could have a material effect on the financial
        statements.  \\nManagement, including the Company\\u2019s Chief Executive
        Officer and Chief Financial Officer, does not expect that the Company\\u2019s
        internal controls will prevent or detect all errors and all fraud. A control
        system, no matter how well designed and operated, can provide only reasonable,
        not absolute, assurance that the objectives of the control system are met.
        Further, the design of a control system must reflect the fact that there are
        resource constraints, and the benefits of controls must be considered relative
        to their costs. Because of the inherent limitations in all control systems,
        no evaluation of internal controls can provide absolute assurance that all
        control issues and instances of fraud, if any, have been detected. Also, any
        evaluation of the effectiveness of controls in future periods are subject
        to the risk that those internal controls may become inadequate because of
        changes in business conditions, or that the degree of compliance with the
        policies or procedures may deteriorate.  \\nManagement\\u2019s Annual Report
        on Internal Control over Financial Reporting  \\nThe Company\\u2019s management
        is responsible for establishing and maintaining adequate internal control
        over financial reporting (as defined in Rule 13a-15(f) under the Exchange
        Act). Management conducted an assessment of the effectiveness of the Company\\u2019s
        internal control over financial reporting based on the criteria set forth
        in Internal Control \\u2013 Integrated Framework issued by the Committee of
        Sponsoring Organizations of the Treadway Commission (2013 framework). Based
        on the Company\\u2019s assessment, management has concluded that its internal
        control over financial reporting was effective as of September30, 2023 to
        provide reasonable assurance regarding the reliability of financial reporting
        and the preparation of financial statements in accordance with GAAP. The Company\\u2019s
        independent registered public accounting firm, Ernst & Young LLP, has issued
        an audit report on the Company\\u2019s internal control over financial reporting,
        which appears in Part II, Item 8 of this Form 10-K.  \\nChanges in Internal
        Control over Financial Reporting  \\nThere were no changes in the Company\\u2019s
        internal control over financial reporting during the fourth quarter of 2023,
        which were identified in connection with management\\u2019s evaluation required
        by paragraph (d) of Rules 13a-15 and 15d-15 under the Exchange Act, that have
        materially affected, or are reasonably likely to materially affect, the Company\\u2019s
        internal control over financial reporting.  \\nItem 9B.Other Information  \\nInsider
        Trading Arrangements  \\nOn August 30, 2023, Deirdre O\\u2019Brien, the Company\\u2019s
        Senior Vice President, Retail, and Jeff Williams, the Company\\u2019s Chief
        Operating Officer, each entered into a trading plan intended to satisfy the
        affirmative defense conditions of Rule 10b5-1(c) under the Exchange Act. The
        plans provide for the sale of all shares vested during the duration of the
        plans pursuant to certain equity awards granted to Ms. O\\u2019Brien and Mr.
        Williams, respectively, excluding any shares withheld by the Company to satisfy
        income tax withholding and remittance obligations. Ms. O\\u2019Brien\\u2019s
        plan will expire on October 15, 2024, and Mr. Williams\\u2019 plan will expire
        on December 15, 2024, subject to early termination for certain specified events
        set forth in the plans.  \\nItem 9C.Disclosure Regarding Foreign Jurisdictions
        that Prevent Inspections  \\nNot applicable.  \\nPART III  \\nItem 10.Directors,
        Executive Officers and Corporate Governance  \\nThe information required by
        this Item will be included in the Company\\u2019s definitive proxy statement
        to be filed with the SEC within 120 days after September30, 2023, in connection
        with the solicitation of proxies for the Company\\u2019s 2024 annual meeting
        of shareholders (the \\u201c2024 Proxy Statement\\u201d), and is incorporated
        herein by reference.  \\nItem 11.Executive Compensation  \\nThe information
        required by this Item will be included in the 2024 Proxy Statement, and is
        incorporated herein by reference.  \\nItem 12.Security Ownership of Certain
        Beneficial Owners and Management and Related Stockholder Matters  \\nThe information
        required by this Item will be included in the 2024 Proxy Statement, and is
        incorporated herein by reference.  \\nItem 13.Certain Relationships and Related
        Transactions, and Director Independence  \\nThe information required by this
        Item will be included in the 2024 Proxy Statement, and is incorporated herein
        by reference.  \\nItem 14.Principal Accountant Fees and Services  \\nThe information
        required by this Item will be included in the 2024 Proxy Statement, and is
        incorporated herein by reference.  \\nPART IV  \\nItem 15.Exhibit and Financial
        Statement Schedules  \\n(a)Documents filed as part of this report  \\n(1)All
        financial statements\",\"distance\":null,\"citation\":{\"natural_id\":\"0000320193-23-000106\",\"company\":\"AAPL\",\"doc_type\":\"10-K\",\"period\":\"2023\",\"version\":\"current\",\"chunk_index\":107,\"headers\":{},\"chunk_id\":\"0000320193-23-000106:107\"},\"source\":\"graphrag\"},{\"text\":\"Growth
        and Development  \\nThe Company invests in resources to help its people develop
        and achieve their career goals. The Company offers programs through Apple
        University on leadership, management and influence, as well as Apple culture
        and values. Team members can also take advantage of online classes for business,
        technical and personal development, as well as learning opportunities to support
        their well-being.  \\nWorkplace Practices and Policies  \\nThe Company is
        an equal opportunity employer committed to inclusion and diversity and to
        providing a workplace free of harassment or discrimination.  \\nInclusion
        and Diversity  \\nThe Company is committed to its vision to build and sustain
        a more inclusive workforce that is representative of the communities it serves.
        The Company continues to work to increase diverse representation at every
        level, foster an inclusive culture, and support equitable pay and access to
        opportunity for all employees.  \\nEngagement  \\nThe Company believes that
        open and honest communication among team members, managers and leaders helps
        create an open, collaborative work environment where everyone can contribute,
        grow and succeed. Team members are encouraged to come to their managers with
        questions, feedback or concerns, and the Company conducts surveys that gauge
        employee sentiment in areas like career development, manager performance and
        inclusivity.  \\nHealth and Safety  \\nThe Company is committed to protecting
        its team members everywhere it operates. The Company identifies potential
        workplace risks in order to develop measures to mitigate possible hazards.
        The Company supports employees with general safety, security and crisis management
        training, and by putting specific programs in place for those working in potentially
        high-hazard environments. Additionally, the Company works to protect the safety
        and security of its team members, visitors and customers through its global
        security team.  \\nAvailable Information  \\nThe Company\\u2019s Annual Reports
        on Form 10-K, Quarterly Reports on Form 10-Q, Current Reports on Form 8-K,
        and amendments to reports filed pursuant to Sections 13(a) and 15(d) of the
        Securities Exchange Act of 1934, as amended (the \\u201cExchange Act\\u201d),
        are filed with the U.S. Securities and Exchange Commission (the \\u201cSEC\\u201d).
        Such reports and other information filed by the Company with the SEC are available
        free of charge at investor.apple.com/investor-relations/sec-filings/default.aspx
        when such reports are available on the SEC\\u2019s website. The Company periodically
        provides certain information for investors on its corporate website, www.apple.com,
        and its investor relations website, investor.apple.com. This includes press
        releases and other information about financial performance, information on
        environmental, social and governance matters, and details related to the Company\\u2019s
        annual meeting of shareholders. The information contained on the websites
        referenced in this Form 10-K is not incorporated by reference into this filing.
        Further, the Company\\u2019s references to website URLs are intended to be
        inactive textual references only.  \\nItem 1A.Risk Factors  \\nThe Company\\u2019s
        business, reputation, results of operations, financial condition and stock
        price can be affected by a number of factors, whether currently known or unknown,
        including those described below. When any one or more of these risks materialize
        from time to time, the Company\\u2019s business, reputation, results of operations,
        financial condition and stock price can be materially and adversely affected.
        \ \\nBecause of the following factors, as well as other factors affecting
        the Company\\u2019s results of operations and financial condition, past financial
        performance should not be considered to be a reliable indicator of future
        performance, and investors should not use historical trends to anticipate
        results or trends in future periods. This discussion of risk factors contains
        forward-looking statements.  \\nThis section should be read in conjunction
        with Part II, Item 7, \\u201cManagement\\u2019s Discussion and Analysis of
        Financial Condition and Results of Operations\\u201d and the consolidated
        financial statements and accompanying notes in Part II, Item 8, \\u201cFinancial
        Statements and Supplementary Data\\u201d of this Form 10-K.  \\nMacroeconomic
        and Industry Risks  \\nThe Company\\u2019s operations and performance depend
        significantly on global and regional economic conditions and adverse economic
        conditions can materially adversely affect the Company\\u2019s business, results
        of operations and financial condition.  \\nThe Company has international operations
        with sales outside the U.S. representing a majority of the Company\\u2019s
        total net sales. In addition, the Company\\u2019s global supply chain is large
        and complex and a majority of the Company\\u2019s supplier facilities, including
        manufacturing and assembly sites, are located outside the U.S. As a result,
        the Company\\u2019s operations and performance depend significantly on global
        and regional economic conditions.  \\nAdverse macroeconomic conditions, including
        slow growth or recession, high unemployment, inflation, tighter credit, higher
        interest rates, and currency fluctuations, can adversely impact consumer confidence
        and spending and materially adversely affect demand for the Company\\u2019s
        products and services. In addition, consumer confidence and spending can be
        materially adversely affected in response to changes in fiscal and monetary
        policy, financial market volatility, declines in income or asset values, and
        other economic factors.  \\nIn addition to an adverse impact on demand for
        the Company\\u2019s products and services, uncertainty about, or a decline
        in, global or regional economic conditions can have a significant impact on
        the Company\\u2019s suppliers, contract manufacturers, logistics providers,
        distributors, cellular network carriers and other channel partners, and developers.
        Potential outcomes include financial instability; inability to obtain credit
        to finance business operations; and insolvency.  \\nAdverse economic conditions
        can also lead to increased credit and collectibility risk on the Company\\u2019s
        trade receivables; the failure of derivative counterparties and other financial
        institutions; limitations on the Company\\u2019s ability to issue new debt;
        reduced liquidity; and declines in the fair values of the Company\\u2019s
        financial instruments. These and other impacts can materially adversely affect
        the Company\\u2019s business, results of operations, financial condition and
        stock price.  \\nThe Company\\u2019s business can be impacted by political
        events, trade and other international disputes, geopolitical tensions, conflict,
        terrorism, natural disasters, public health issues, industrial accidents and
        other business interruptions.  \\nPolitical events, trade and other international
        disputes, geopolitical tensions, conflict, terrorism, natural disasters, public
        health issues, industrial accidents and other business interruptions can have
        a material adverse effect on the Company and its customers, employees, suppliers,
        contract manufacturers, logistics providers, distributors, cellular network
        carriers and other channel partners.  \\nThe Company has a large, global business
        with sales outside the U.S. representing a majority of the Company\\u2019s
        total net sales, and the Company believes that it generally benefits from
        growth in international trade. Substantially all of the Company\\u2019s manufacturing
        is performed in whole or in part by outsourcing partners located primarily
        in China mainland, India, Japan, South Korea, Taiwan and Vietnam. Restrictions
        on international trade, such as tariffs and other controls on imports or exports
        of goods, technology or data, can materially adversely affect the Company\\u2019s
        business and supply chain. The impact can be particularly significant if these
        restrictive measures apply to countries and regions where the Company derives
        a significant portion of its revenues and/or has significant supply chain
        operations. Restrictive measures can increase the cost of the Company\\u2019s
        products and the components and raw materials that go into them, and can require
        the Company to take various actions, including changing suppliers, restructuring
        business relationships and operations, and ceasing to offer and distribute
        affected products, services and third-party applications to its customers.
        Changing the Company\\u2019s business and supply chain in accordance with
        new or changed restrictions on international trade can be expensive, time-consuming
        and disruptive to the Company\\u2019s operations. Such restrictions can be
        announced with little or no advance notice, which can create uncertainty,
        and the Company may not be able to effectively mitigate all adverse impacts
        from such measures. For example, tensions between governments, including the
        U.S. and China, have in the past led to tariffs and other restrictions affecting
        the Company\\u2019s business. If disputes and conflicts further escalate in
        the future, actions by governments in response could be significantly more
        severe and restrictive and could materially adversely affect the Company\\u2019s
        business.  \\nMany of the Company\\u2019s operations and facilities, as well
        as critical business operations of the Company\\u2019s suppliers and contract
        manufacturers, are in locations that are prone to earthquakes and other natural
        disasters. Global climate change is resulting in certain types of natural
        disasters and extreme weather occurring more frequently or with more intense
        effects. In addition, the Company\\u2019s and its suppliers\\u2019 operations
        and facilities are subject to the risk of interruption by fire, power shortages,
        nuclear power plant accidents and other industrial accidents, terrorist attacks
        and other hostile acts, ransomware and other cybersecurity attacks, labor
        disputes, public health issues and other events beyond the Company\\u2019s
        control. For example, global supply chains can be highly concentrated and
        geopolitical tensions or conflict could result in significant disruptions.
        \ \\nSuch events can make it difficult or impossible for the Company to manufacture
        and deliver products to its customers, create delays and inefficiencies in
        the Company\\u2019s supply and manufacturing chain, result in slowdowns and
        outages to the Company\\u2019s service offerings, increase the Company\\u2019s
        costs, and negatively impact consumer spending and demand in affected areas.
        \ \\nThe Company\\u2019s operations are also subject to the risks of industrial
        accidents at its suppliers and contract manufacturers. While the Company\\u2019s
        suppliers are required to maintain safe working environments and operations,
        an industrial accident could occur and could result in serious injuries or
        loss of life, disruption to the Company\\u2019s business, and harm to the
        Company\\u2019s reputation. Major public health issues, including pandemics
        such as the COVID-19 pandemic, have adversely affected, and could in the future
        materially adversely affect, the Company due to their impact on the global
        economy and demand for consumer products; the imposition of protective public
        safety measures, such as stringent employee travel restrictions and limitations
        on freight services and the movement of products between regions; and disruptions
        in the Company\\u2019s operations, supply chain and sales and distribution
        channels, resulting in interruptions to the supply of current products and
        offering of existing services, and delays in production ramps of new products
        and development of new services.  \\nFollowing any interruption to its business,
        the Company can require substantial recovery time, experience significant
        expenditures to resume operations, and lose significant sales. Because the
        Company relies on single or limited sources for the supply and manufacture
        of many critical components, a business interruption affecting such sources
        would exacerbate any negative consequences to the Company. While the Company
        maintains insurance coverage for certain types of losses, such insurance coverage
        may be insufficient to cover all losses that may arise.  \\nGlobal markets
        for the Company\\u2019s products and services are highly competitive and subject
        to rapid technological change, and the Company may be unable to compete effectively
        in these markets.  \\nThe Company\\u2019s products and services are offered
        in highly competitive global markets characterized by aggressive price competition
        and resulting downward pressure on gross margins, frequent introduction of
        new products and services, short product life cycles, evolving industry standards,
        continual improvement in product price and performance characteristics, rapid
        adoption of technological advancements by competitors, and price sensitivity
        on the part of consumers and businesses.  \\nThe Company\\u2019s ability to
        compete successfully depends heavily on ensuring the continuing and timely
        introduction of innovative new products, services and technologies to the
        marketplace. The Company designs and develops nearly the entire solution for
        its products, including the hardware, operating system, numerous software
        applications and related services. As a result, the Company must make significant
        investments in R&D. There can be no assurance these investments will achieve
        expected returns, and the Company may not be able to develop and market new
        products and services successfully.  \\nThe Company currently holds a significant
        number of patents, trademarks and copyrights and has registered, and applied
        to register, additional patents, trademarks and copyrights. In contrast, many
        of the Company\\u2019s competitors seek to compete primarily through aggressive
        pricing and very low cost structures, and by imitating the Company\\u2019s
        products and infringing on itsintellectual property. Effective intellectual
        property protection is not consistently available in every country in which
        the Company operates. If the Company is unable to continue to develop and
        sell innovative new products with attractive margins or if competitors infringe
        on the Company\\u2019s intellectual property, the Company\\u2019s ability
        to maintain a competitive advantage could be materially adversely affected.
        \ \\nThe Company has a minority market share in the global smartphone, personal
        computer and tablet markets. The Company faces substantial competition in
        these markets from companies that have significant technical, marketing, distribution
        and other resources, as well as established hardware, software and digital
        content supplier relationships. In addition, some of the Company\\u2019s competitors
        have broader product lines, lower-priced products and a larger installed base
        of active devices. Competition has been particularly intense as competitors
        have aggressively cut prices and lowered product margins. Certain competitors
        have the resources, experience or cost structures to provide products at little
        or no profit or even at a loss. Some of the markets in which the Company competes
        have from time to time experienced little to no growth or contracted overall.
        \ \\nAdditionally, the Company faces significant competition as competitors
        imitate the Company\\u2019s product features and applications within their
        products or collaborate to offer solutions that are more competitive than
        those they currently offer. The Company also expects competition to intensify
        as competitors imitate the Company\\u2019s approach to providing components
        seamlessly within their offerings or work collaboratively to offer integrated
        solutions.  \\nThe Company\\u2019s services also face substantial competition,
        including from companies that have significant resources and experience and
        have established service offerings with large customer bases. The Company
        competes with business models that provide content to users for free. The
        Company also competes with illegitimate means to obtain third-party digital
        content and applications.\",\"distance\":null,\"citation\":{\"natural_id\":\"0000320193-24-000123\",\"company\":\"AAPL\",\"doc_type\":\"10-K\",\"period\":\"2024\",\"version\":\"current\",\"chunk_index\":16,\"headers\":{},\"chunk_id\":\"0000320193-24-000123:16\"},\"source\":\"graphrag\"},{\"text\":\"The
        Company has faced and continues to face a significant number of patent claims
        relating to its standards-enabled products, and new claims may arise in the
        future, including as a result of new legal or regulatory frameworks. For example,
        technology, data and other intellectual property asset\\u2013holding companies
        frequently assert their intellectual property rights and seek royalties and
        often enter into litigation based on allegations of infringement or other
        violations of intellectual property rights. These risks, and the risks of
        novel claims being attempted, may be exacerbated as new and emerging technologies,
        including machine learning and artificial intelligence, are further integrated
        into the Company\\u2019s products and services. The Company is vigorously
        defending infringement actions in courts in several U.S. jurisdictions, as
        well as internationally in various countries. The plaintiffs in these actions
        frequently seek broad injunctive relief and substantial damages.  \\nRegardless
        of the merit of particular claims, defending against litigation or responding
        to government investigations can be expensive, time-consuming and disruptive
        to the Company\\u2019s operations. In recognition of these considerations,
        the Company may enter into agreements or other arrangements to settle litigation
        and resolve such challenges. However, such agreements may not always be available
        on acceptable terms, and litigation may still arise. Such agreements can also
        significantly reduce the Company\\u2019s revenue and increase the Company\\u2019s
        cost of sales and operating expenses, materially adversely affecting the Company\\u2019s
        business, results of operations, financial condition and stock price. Additionally,
        such agreements may require the Company to change its business practices and
        limit the Company\\u2019s ability to offer certain products and services.
        \ \\nThe outcome of litigation or government investigations is inherently
        uncertain. If one or more legal matters were resolved against the Company
        or an indemnified third party in a reporting period for amounts above management\\u2019s
        expectations, the Company\\u2019s results of operations, financial condition
        and stock price for that reporting period could be materially adversely affected.
        Further, such an outcome can result in significant monetary damages, disgorgement
        of revenue or profits, remedial corporate measures or injunctive relief against
        the Company. Adverse resolution of legal matters has from time to time required,
        and can in the future require, the Company to change its business practices.
        It can also limit the Company\\u2019s ability to enjoin others from using,
        or to derive value from, its intellectual property rights, and to develop,
        manufacture, use, import or offer for sale certain products and services,
        all of which could materially adversely affect the Company\\u2019s business,
        reputation, results of operations, financial condition and stock price.  \\nWhile
        the Company maintains insurance coverage for certain types of claims, such
        insurance coverage may be insufficient to cover all losses or all types of
        claims that may arise.  \\nThe Company is subject to complex and changing
        laws and regulations worldwide, which exposes the Company to potential liabilities,
        increased costs and other adverse effects on the Company\\u2019s business.
        \ \\nThe Company\\u2019s global operations are subject to complex and changing
        laws and regulations worldwide on subjects including antitrust; privacy, data
        security and data localization; online safety; age verification; consumer
        protection; advertising, sales, billing and e-commerce; financial services
        and technology; product liability; intellectual property ownership and infringement;
        digital platforms; machine learning and artificial intelligence; internet,
        telecommunications and mobile communications; media, television, film and
        digital content; availability of third-party software applications and services;
        labor and employment; anticorruption; import, export and trade; foreign exchange
        controls and cash repatriation restrictions; anti\\u2013money laundering;
        foreign ownership and investment; national security; tax; and environmental,
        health and safety, including electronic waste, recycling, product design and
        climate change.  \\nCompliance with these laws and regulations is onerous
        and expensive. New and changing laws, regulations, executive orders, directives,
        and enforcement priorities can adversely affect the Company\\u2019s business
        by increasing the Company\\u2019s costs, limiting the Company\\u2019s ability
        to offer a product, service or feature to customers, imposing changes to the
        design of the Company\\u2019s products and services, impacting customer demand
        for the Company\\u2019s products and services, and requiring changes to the
        Company\\u2019s business or supply chain. New and changing laws, regulations,
        executive orders, directives, and enforcement priorities can also create uncertainty
        about how such laws and regulations will be interpreted and applied. If the
        Company is found to have violated such laws and regulations, it could materially
        adversely affect the Company\\u2019s business, reputation, results of operations,
        financial condition and stock price.  \\nRisks and costs related to new and
        changing laws, regulations, executive orders, directives, and enforcement
        priorities increase as the Company\\u2019s products and services are introduced
        into specialized applications, including health and financial services, or
        as the Company expands the use of technologies, such as machine learning and
        artificial intelligence features, and must navigate new legal, regulatory
        and ethical considerations relating to such technologies.  \\nRegulatory changes
        and other actions that materially adversely affect the Company\\u2019s business
        may be announced with little or no advance notice and the Company may not
        be able to effectively mitigate all adverse impacts from such measures. For
        example, the Company is subject to changing regulations relating to the export
        and import of its products. The Company\\u2019s programs, policies and procedures
        may not be effective in preventing a violation or a claim of a violation.
        As a result, the Company\\u2019s products could be banned, delayed or prohibited
        from importation, which could materially adversely affect the Company\\u2019s
        business, reputation, results of operations, financial condition and stock
        price.  \\nVaried stakeholder expectations about social and other issues expose
        the Company to potential liabilities, increased costs, reputational harm,
        and other adverse effects on the Company\\u2019s business.  \\nVarious stakeholders,
        including governments, regulators, investors, employees, customers and others,
        have differing expectations about a wide range of social and other issues
        related to the Company\\u2019s business. The Company makes statements about
        its values, including the environmental and societal impact of its business,
        through various reports, information provided on the Company\\u2019s website,
        and in press statements and other communications. The Company also pursues
        environmental and other goals and initiatives that involve risks and uncertainties,
        require investments, and depend in part on third-party performance or data
        that is outside the Company\\u2019s control, and the Company may not be able
        to fully achieve all of its goals and initiatives. Efforts by the Company
        to advance its business and values, or achieve its goals and further its initiatives,
        or to align with stakeholders\\u2019 expectations, or comply with evolving,
        varied and at times conflicting federal, state and international laws, executive
        orders, regulations and standards, or any failure or perceived failure to
        do so, can result in adverse reactions by consumers and other stakeholders,
        including the commencement of legal and regulatory proceedings against the
        Company, and can materially adversely affect the Company\\u2019s business,
        reputation, results of operations, financial condition and stock price.  \\nThe
        technology industry, including, in some instances, the Company, is subject
        to intense media, political and regulatory scrutiny, which exposes the Company
        to increasing regulation, government investigations, legal actions and penalties.
        \ \\nFrom time to time, the Company has made changes to its business, including
        actions taken in response to litigation, competition, market conditions and
        legal and regulatory requirements. The Company expects to make further business
        changes in the future. For example, in the U.S., the Company has implemented
        changes to how developers communicate with consumers within apps on the U.S.
        storefront of the iOS and iPadOS App Store regarding alternative purchasing
        mechanisms and is currently subject to a court order preventing it from imposing
        any commission or fee on certain purchases that consumers make.  \\nGlobally,
        several jurisdictions have adopted, or may in the future adopt, competition-related
        laws and regulations imposing wide-ranging obligations on technology companies
        and significant limitations on businesses, including the Company. For example,
        the Company has implemented changes to iOS, iPadOS, the App Store and Safari\\u00ae
        in the EU as it seeks to comply with the Digital Markets Act (\\u201cDMA\\u201d),
        including new business terms and alternative fee structures for iOS and iPadOS
        apps, alternative methods of distribution for iOS and iPadOS apps, alternative
        payment processing for apps across the Company\\u2019s operating systems,
        and additional tools and application programming interfaces for developers.
        The Company has also continued to make changes to its compliance plan in response
        to feedback and engagement with the Commission. Although the Company\\u2019s
        compliance plan is intended to address the DMA\\u2019s obligations, it has
        been challenged by the Commission and may be challenged further by private
        litigants. The DMA provides for significant fines and penalties for noncompliance.
        While the changes introduced by the Company in the EU are intended to reduce
        new privacy and security risks that the DMA poses to EU users, many risks
        will remain. Changes to the Company\\u2019s business in response to the DMA
        or other laws and regulations could materially adversely affect the Company\\u2019s
        business, reputation, results of operations, financial condition and stock
        price.  \\nThe Company is also currently subject to antitrust investigations
        and litigation in various jurisdictions around the world, which can result
        in legal proceedings and claims against the Company that could, individually
        or in the aggregate, have a material adverse impact on the Company\\u2019s
        business, results of operations, financial condition and stock price. For
        example, the Company is subject to civil antitrust lawsuits in the U.S. alleging
        monopolization or attempted monopolization in the markets for \\u201cperformance
        smartphones\\u201d and \\u201csmartphones\\u201d generally in violation of
        U.S. antitrust laws. In addition, the Company is the subject of investigations
        in Europe and other jurisdictions relating to App Store terms and conditions.
        If such investigations or litigation are resolved against the Company, the
        Company can be exposed to significant fines and may be required to make further
        changes to its business practices, all of which could materially adversely
        affect the Company\\u2019s business, reputation, results of operations, financial
        condition and stock price.  \\nFurther, the Company has commercial relationships
        with other companies in the technology industry that are or may become subject
        to investigations and litigation that, if resolved against those other companies,
        could materially adversely affect the Company\\u2019s commercial relationships
        with those business partners and materially adversely affect the Company\\u2019s
        business, results of operations, financial condition and stock price. For
        example, the Company earns revenue from licensing arrangements with Google
        LLC (\\u201cGoogle\\u201d) and other companies to offer their search services
        on the Company\\u2019s platforms and applications, and certain of these arrangements
        are currently subject to government investigations and legal proceedings.
        On August 5, 2024, Google was found to have violated U.S. antitrust laws.
        In connection with this finding, on September 2, 2025, the U.S. District Court
        for the District of Columbia (\\u201cD.C. District Court\\u201d) ordered certain
        remedies. The court\\u2019s order is subject to further proceedings before
        the D.C. District Court, which may result in changes to the interpretation
        or application of the remedies ordered by the court, as well as new or changed
        remedies being ordered. The court\\u2019s order is also subject to appeal
        by both the U.S. Department of Justice (\\u201cDOJ\\u201d) and Google. A reversal
        of the order on appeal could result in imposition of certain remedies initially
        proposed by the DOJ, such as those prohibiting Google from offering the Company
        commercial terms for search distribution. If implemented, these remedies could
        materially adversely affect the Company\\u2019s ability to earn revenue from
        such licensing arrangements.  \\nThe Company\\u2019s business, results of
        operations, financial condition and stock price can be materially adversely
        affected, individually or in the aggregate, by the outcomes of such investigations,
        litigation or changes to laws and regulations in the future. Changes to the
        Company\\u2019s business practices to comply with new laws and regulations
        or in connection with legal proceedings can negatively impact the reputation
        of the Company\\u2019s products for privacy and security. Such changes in
        business practices can also otherwise adversely affect the experience for
        users of the Company\\u2019s products and services, and result in harm to
        the Company\\u2019s reputation, loss of competitive advantage, poor market
        acceptance, reduced demand for products and services, lost sales, and lower
        profit margins.  \\nThe Company\\u2019s business is subject to a variety of
        U.S. and international laws, rules, policies and other obligations regarding
        the collection, use, protection and transfer of personal data.  \\nThe Company
        is subject to an increasing number of federal, state and international laws
        relating to the collection, use, retention, protection and transfer of various
        types of personal data. In many cases, these laws apply not only to third-party
        transactions, but also restrict transfers of personal data among the Company
        and its international subsidiaries. Several jurisdictions have passed laws
        in this area, and additional jurisdictions are considering imposing additional
        restrictions or have laws that are pending. These laws continue to develop
        and may be inconsistent from jurisdiction to jurisdiction. Complying with
        emerging and changing requirements causes the Company to incur substantial
        costs and has required and may in the future require the Company to change
        its business practices. Noncompliance could result in significant penalties
        or legal liability.  \\nThe Company makes statements about its use and disclosure
        of personal data through its privacy policy, information provided on its website,
        press statements and other privacy notices provided to customers. Any failure
        or perceived failure by the Company to comply with these public statements
        or with federal, state or international privacy or data protection laws and
        regulations could result in inquiries, proceedings and penalties from governmental
        entities or others. Such a failure or perceived failure could also result
        in reputational impacts, ongoing audit requirements and significant legal
        liability. The risks of inadvertent disclosure of personal data can increase
        with the introduction of new and complex technologies, such as artificial
        intelligence features, further exacerbating such risks.\",\"distance\":null,\"citation\":{\"natural_id\":\"0000320193-25-000079\",\"company\":\"AAPL\",\"doc_type\":\"10-K\",\"period\":\"2025\",\"version\":\"current\",\"chunk_index\":19,\"headers\":{},\"chunk_id\":\"0000320193-25-000079:19\"},\"source\":\"graphrag\"},{\"text\":\"Human
        Capital  \\nThe Company believes that its people play an important role in
        its success, and strives to attract, develop and retain the best talent. The
        Company works to create a culture of collaboration, one where people with
        a broad range of backgrounds and perspectives can come together to innovate
        and do the best work of their lives. The Company is an equal opportunity employer
        committed to inclusion and to providing a workplace free of harassment or
        discrimination. As of September27, 2025, the Company had approximately 166,000
        full-time equivalent employees.  \\nThe Company believes that compensation
        should be competitive and equitable, and offers discretionary cash and equity
        awards to enable employees to share in the Company\\u2019s success. The Company
        recognizes its people are most likely to thrive when they have the resources
        to meet their needs and the time and support to succeed in their professional
        and personal lives. In support of this, the Company offers a wide variety
        of benefits for employees around the world, including health, wellness and
        time away.  \\nThe Company invests in resources to help its people develop
        and achieve their career goals. The Company offers programs through Apple
        University on leadership, management and influence, as well as Apple culture
        and values. Team members can also take advantage of online classes for business,
        technical and personal development.  \\nThe Company believes that open and
        honest communication among team members, managers and leaders helps create
        an open, collaborative work environment where everyone can contribute, grow
        and succeed. Team members are encouraged to come to their managers with questions,
        feedback or concerns, and the Company conducts surveys that gauge employee
        sentiment in areas like career development, manager performance and inclusion.
        \ \\nThe Company is committed to the safety and security of its team members
        everywhere it operates. The Company supports employees with general safety,
        security and crisis management training, and by putting specific programs
        in place for those working in potentially high-hazard environments.  \\nAvailable
        Information  \\nThe Company\\u2019s Annual Reports on Form 10-K, Quarterly
        Reports on Form 10-Q, Current Reports on Form 8-K, and amendments to reports
        filed pursuant to Sections 13(a) and 15(d) of the Securities Exchange Act
        of 1934, as amended (\\u201cExchange Act\\u201d), are filed with the U.S.
        Securities and Exchange Commission (\\u201cSEC\\u201d). Such reports and other
        information filed by the Company with the SEC are available free of charge
        at investor.apple.com/investor-relations/sec-filings/default.aspx when such
        reports are available on the SEC\\u2019s website. The Company periodically
        provides certain information for investors on its corporate website, www.apple.com,
        and its investor relations website, investor.apple.com. This includes press
        releases and other information about financial performance, information on
        corporate governance, and details related to the Company\\u2019s annual meeting
        of shareholders. The information contained on the websites referenced in this
        Form 10-K is not incorporated by reference into this filing. Further, the
        Company\\u2019s references to website URLs are intended to be inactive textual
        references only.  \\nItem 1A.Risk Factors  \\nThe following summarizes factors
        that could have a material adverse effect on the Company\\u2019s business,
        reputation, results of operations, financial condition and stock price. The
        Company may not be able to accurately predict, control or mitigate these risks.
        Statements in this section are based on the Company\\u2019s beliefs and opinions
        regarding matters that could materially adversely affect the Company in the
        future and are not representations as to whether such matters have or have
        not occurred previously. The risks and uncertainties described below are not
        exhaustive and should not be considered a complete statement of all potential
        risks or uncertainties that the Company faces or may face in the future.  \\nThis
        section should be read in conjunction with Part II, Item 7, \\u201cManagement\\u2019s
        Discussion and Analysis of Financial Condition and Results of Operations\\u201d
        and the consolidated financial statements and accompanying notes in Part II,
        Item 8, \\u201cFinancial Statements and Supplementary Data\\u201d of this
        Form 10-K.  \\nMacroeconomic and Industry Risks  \\nThe Company\\u2019s operations
        and performance depend significantly on global and regional economic conditions
        and adverse economic conditions can materially adversely affect the Company\\u2019s
        business, results of operations, financial condition and stock price.  \\nThe
        Company has international operations with sales outside the U.S. representing
        a majority of the Company\\u2019s total net sales. In addition, the Company\\u2019s
        global supply chain is large and complex and a majority of the Company\\u2019s
        supplier facilities, including manufacturing and assembly sites, are located
        outside the U.S. As a result, the Company\\u2019s operations and performance
        depend significantly on global and regional economic conditions.  \\nAdverse
        macroeconomic conditions, including slow growth or recession, high unemployment,
        inflation, tighter credit, higher interest rates, and currency fluctuations,
        can adversely impact consumer confidence and spending and materially adversely
        affect demand for the Company\\u2019s products and services. In addition,
        consumer confidence and spending can be materially adversely affected in response
        to changes in fiscal and monetary policy, financial market volatility, declines
        in income or asset values, and other economic factors.  \\nUncertainty about,
        or a decline in, global or regional economic conditions can also have a significant
        impact on the Company\\u2019s suppliers, contract manufacturers, logistics
        providers, distributors, cellular network carriers and other channel partners,
        and developers. Potential outcomes include financial instability; inability
        to obtain credit to finance business operations; and insolvency.  \\nAdverse
        economic conditions can also lead to increased credit and collectibility risk
        on the Company\\u2019s trade receivables; the failure of derivative counterparties
        and other financial institutions; limitations on the Company\\u2019s ability
        to issue new debt; reduced liquidity; and declines in the fair values of the
        Company\\u2019s financial instruments. These and other impacts can materially
        adversely affect the Company\\u2019s business, results of operations, financial
        condition and stock price.  \\nThe Company\\u2019s business can be impacted
        by political events, trade and other international disputes, geopolitical
        tensions, conflict, terrorism, natural disasters, public health issues, industrial
        accidents and other business interruptions.  \\nPolitical events, trade and
        other international disputes, geopolitical tensions, conflict, terrorism,
        natural disasters, public health issues, industrial accidents and other business
        interruptions can have a material adverse effect on the Company and its customers,
        employees, suppliers, contract manufacturers, logistics providers, distributors,
        cellular network carriers and other channel partners.  \\nThe Company has
        a large, global business with sales outside the U.S. representing a majority
        of the Company\\u2019s total net sales, and the Company believes that it generally
        benefits from growth in international trade. A significant majority of the
        Company\\u2019s manufacturing is performed in whole or in part by outsourcing
        partners located primarily in China mainland, India, Japan, South Korea, Taiwan
        and Vietnam, in addition to sourcing from partners and facilities located
        in the U.S. Restrictions on international trade, such as tariffs and other
        controls on imports or exports of goods, technology or data, can materially
        adversely affect the Company\\u2019s business and supply chain. The impact
        can be particularly significant if these restrictive measures apply to countries
        and regions where the Company derives a significant portion of its revenues
        and/or has significant supply chain operations. Restrictive measures can increase
        the cost or limit the availability of the Company\\u2019s products and the
        components and rare earths and other raw materials that go into them. Restrictive
        measures can also require the Company to change suppliers, restructure business
        relationships and operations, refrain from offering and distributing or cease
        to offer and distribute affected products, services and third-party applications
        to its customers, and increase the prices of its products and services. Changing
        the Company\\u2019s business and supply chain in accordance with new or changed
        restrictions on international trade can be expensive, time-consuming and disruptive
        to the Company\\u2019s business and results of operations. Trade and other
        international disputes can also have an adverse impact on the overall macroeconomic
        environment and result in shifts and reductions in consumer spending and negative
        consumer sentiment for the Company\\u2019s products and services, all of which
        can further adversely affect the Company\\u2019s business and results of operations.
        Such restrictions can be announced with little or no advance notice, which
        can create uncertainty, and the Company may not be able to effectively mitigate
        any or all adverse impacts from such measures. Global supply chains can be
        highly concentrated, and an escalation of geopolitical tensions or conflict
        could result in significant disruptions. Beginning in the second quarter of
        2025, new tariffs were announced on imports to the U.S. (\\u201cU.S. Tariffs\\u201d),
        including additional tariffs on imports from China, India, Japan, South Korea,
        Taiwan, Vietnam and the European Union (\\u201cEU\\u201d), among others. In
        response, several countries have imposed, or threatened to impose, reciprocal
        tariffs on imports from the U.S. and other retaliatory measures. Various modifications
        to the U.S. Tariffs have been announced and further changes could be made
        in the future, which may include additional sector-based tariffs or other
        measures. For example, the U.S. Department of Commerce has initiated an investigation
        under Section 232 of the Trade Expansion Act of 1962, as amended, into, among
        other things, imports of semiconductors, semiconductor manufacturing equipment,
        and their derivative products, including downstream products that contain
        semiconductors. The ultimate impact remains uncertain and will depend on several
        factors, including whether additional or incremental U.S. Tariffs or other
        measures are announced or imposed, to what extent other countries implement
        tariffs or other retaliatory measures in response, and the overall magnitude
        and duration of these measures. If disputes and conflicts further escalate,
        actions by governments in response could be significantly more severe and
        restrictive.  \\nMany of the Company\\u2019s operations, retail stores and
        facilities, as well as critical business operations of the Company\\u2019s
        suppliers and contract manufacturers, are in locations that are prone to earthquakes
        and other natural disasters. Global climate change is resulting in certain
        types of natural disasters and extreme weather occurring more frequently or
        with more intense effects. In addition, the Company\\u2019s and its suppliers\\u2019
        operations, retail stores and facilities are subject to the risk of interruption
        by fire, power shortages, nuclear power plant accidents and other industrial
        accidents, terrorist attacks and other hostile acts, ransomware and other
        cybersecurity attacks, labor disputes, public health issues and other events
        beyond the Company\\u2019s control.  \\nSuch events can make it difficult
        or impossible for the Company to manufacture and deliver products to its customers,
        create delays and inefficiencies in the Company\\u2019s supply and manufacturing
        chain, result in slowdowns and outages to the Company\\u2019s service offerings,
        increase the Company\\u2019s costs, and negatively impact consumer spending
        and demand in affected areas.  \\nThe Company\\u2019s operations are also
        subject to the risks of industrial accidents at its suppliers and contract
        manufacturers. While the Company\\u2019s suppliers are required to maintain
        safe working environments and operations, an industrial accident could occur
        and could result in serious injuries or loss of life, disruption to the Company\\u2019s
        business, and harm to the Company\\u2019s reputation. Major public health
        issues, including pandemics such as the COVID-19 pandemic, have adversely
        affected, and could in the future materially adversely affect, the Company
        due to their impact on the global economy and demand for consumer products;
        the imposition of protective public safety measures, such as stringent employee
        travel restrictions and limitations on freight services and the movement of
        products between regions; and disruptions in the Company\\u2019s operations,
        supply chain and sales and distribution channels, resulting in interruptions
        to the supply of current products and offering of existing services, and delays
        in production ramps of new products and development of new services.  \\nFollowing
        any interruption to its business, the Company can require substantial recovery
        time, incur significant expenditures to resume operations, and lose significant
        sales. Because the Company relies on single or limited sources for the supply
        and manufacture of many critical components, a business interruption affecting
        such sources would exacerbate any negative consequences to the Company. While
        the Company maintains insurance coverage for certain types of losses, such
        insurance coverage may be insufficient to cover all losses that may arise.
        Any of the foregoing can materially adversely affect the Company\\u2019s business,
        results of operations, financial condition and stock price.  \\nGlobal markets
        for the Company\\u2019s products and services are highly competitive and subject
        to rapid technological change, and the Company may be unable to compete effectively
        in these markets.  \\nThe Company\\u2019s products and services are offered
        in highly competitive global markets. These markets are characterized by aggressive
        price competition, downward pressure on gross margins, continual improvement
        in product performance, and price sensitivity on the part of consumers and
        businesses. These markets are further defined by frequent introduction of
        new products and services, short product life cycles, evolving industry standards,
        and rapid adoption of technological advancements.  \\nThe Company\\u2019s
        ability to compete successfully depends heavily on ensuring the continuing
        and timely introduction of innovative new products, services and technologies
        to the marketplace. The Company designs and develops nearly the entire solution
        for its products, including the hardware, operating system, numerous software
        applications and related services. As a result, the Company must make significant
        investments in R&D. These investments may not achieve expected returns, and
        the Company may not be able to develop and market new products and services
        successfully.  \\nThe Company\\u2019s ability to compete successfully also
        depends on the effective protection and enforcement of its intellectual property
        rights. Regulatory requirements, government investigations and litigation
        can force the Company to withdraw from, or modify its products and services
        for, certain countries and limit its ability to derive value from, or to enjoin
        others from using, its intellectual property rights. Additionally, they may
        require the Company to share its innovations with competitors. Any of these
        outcomes can have a negative impact on the Company\\u2019s competitive advantage
        and materially adversely affect its business, results of operations, financial
        condition and stock price.\",\"distance\":null,\"citation\":{\"natural_id\":\"0000320193-25-000079\",\"company\":\"AAPL\",\"doc_type\":\"10-K\",\"period\":\"2025\",\"version\":\"current\",\"chunk_index\":16,\"headers\":{},\"chunk_id\":\"0000320193-25-000079:16\"},\"source\":\"graphrag\"}]},\"_meta\":{\"io.modelcontextprotocol/serverInfo\":{\"name\":\"graph\",\"version\":\"\"}}}}\r\n\r\n"
