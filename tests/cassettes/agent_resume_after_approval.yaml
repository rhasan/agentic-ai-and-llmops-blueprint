        \     \\\"text\\\": \\\"/s/ Ernst & Young LLP  \\\\nWe have served as Apple
        Inc.\\u2019s auditor since 2009.  \\\\nSan Jose, California  \\\\nNovember2,
        2023  \\\\nReport of Independent Registered Public Accounting Firm  \\\\nTo
        the Shareholders and the Board of Directors of Apple Inc.  \\\\nOpinion on
        Internal Control Over Financial Reporting  \\\\nWe have audited Apple Inc.\\u2019s
        internal control over financial reporting as of September30, 2023, based on
        criteria established in Internal Control \\u2013 Integrated Framework issued
        by the Committee of Sponsoring Organizations of the Treadway Commission (2013
        framework) (the \\u201cCOSO criteria\\u201d). In our opinion, Apple Inc. maintained,
        in all material respects, effective internal control over financial reporting
        as of September30, 2023, based on the COSO criteria.  \\\\nWe also have audited,
        in accordance with the standards of the Public Company Accounting Oversight
        Board (United States) (the \\u201cPCAOB\\u201d), the consolidated balance
        sheets of Apple Inc. as of September30, 2023 and September24, 2022, the related
        consolidated statements of operations, comprehensive income, shareholders\\u2019
        equity and cash flows for each of the three years in the period ended September30,
        2023, and the related notes and our report dated November2, 2023 expressed
        an unqualified opinion thereon.  \\\\nBasis for Opinion  \\\\nApple Inc.\\u2019s
        management is responsible for maintaining effective internal control over
        financial reporting, and for its assessment of the effectiveness of internal
        control over financial reporting included in the accompanying Management\\u2019s
        Annual Report on Internal Control over Financial Reporting. Our responsibility
        is to express an opinion on Apple Inc.\\u2019s internal control over financial
        reporting based on our audit. We are a public accounting firm registered with
        the PCAOB and are required to be independent with respect to Apple Inc. in
        accordance with the U.S. federal securities laws and the applicable rules
        and regulations of the U.S. Securities and Exchange Commission and the PCAOB.
        \ \\\\nWe conducted our audit in accordance with the standards of the PCAOB.
        Those standards require that we plan and perform the audit to obtain reasonable
        assurance about whether effective internal control over financial reporting
        was maintained in all material respects.  \\\\nOur audit included obtaining
        an understanding of internal control over financial reporting, assessing the
        risk that a material weakness exists, testing and evaluating the design and
        operating effectiveness of internal control based on the assessed risk, and
        performing such other procedures as we considered necessary in the circumstances.
        We believe that our audit provides a reasonable basis for our opinion.  \\\\nDefinition
        and Limitations of Internal Control Over Financial Reporting  \\\\nA company\\u2019s
        internal control over financial reporting is a process designed to provide
        reasonable assurance regarding the reliability of financial reporting and
        the preparation of financial statements for external purposes in accordance
        with U.S. generally accepted accounting principles. A company\\u2019s internal
        control over financial reporting includes those policies and procedures that
        (1)pertain to the maintenance of records that, in reasonable detail, accurately
        and fairly reflect the transactions and dispositions of the assets of the
        company; (2)provide reasonable assurance that transactions are recorded as
        necessary to permit preparation of financial statements in accordance with
        U.S. generally accepted accounting principles, and that receipts and expenditures
        of the company are being made only in accordance with authorizations of management
        and directors of the company; and (3)provide reasonable assurance regarding
        prevention or timely detection of unauthorized acquisition, use, or disposition
        of the company\\u2019s assets that could have a material effect on the financial
        statements.  \\\\nBecause of its inherent limitations, internal control over
        financial reporting may not prevent or detect misstatements. Also, projections
        of any evaluation of effectiveness to future periods are subject to the risk
        that controls may become inadequate because of changes in conditions, or that
        the degree of compliance with the policies or procedures may deteriorate.
        \ \\\\n/s/ Ernst & Young LLP  \\\\nSan Jose, California  \\\\nNovember2, 2023
        \ \\\\nItem 9.Changes in and Disagreements with Accountants on Accounting
        and Financial Disclosure  \\\\nNone.  \\\\nItem 9A.Controls and Procedures
        \ \\\\nEvaluation of Disclosure Controls and Procedures  \\\\nBased on an
        evaluation under the supervision and with the participation of the Company\\u2019s
        management, the Company\\u2019s principal executive officer and principal
        financial officer have concluded that the Company\\u2019s disclosure controls
        and procedures as defined in Rules 13a-15(e) and 15d-15(e) under the Exchange
        Act were effective as of September30, 2023 to provide reasonable assurance
        that information required to be disclosed by the Company in reports that it
        files or submits under the Exchange Act is (i)recorded, processed, summarized
        and reported within the time periods specified in the SEC rules and forms
        and (ii)accumulated and communicated to the Company\\u2019s management, including
        its principal executive officer and principal financial officer, as appropriate
        to allow timely decisions regarding required disclosure.  \\\\nInherent Limitations
        over Internal Controls  \\\\nThe Company\\u2019s internal control over financial
        reporting is designed to provide reasonable assurance regarding the reliability
        of financial reporting and the preparation of financial statements for external
        purposes in accordance with GAAP. The Company\\u2019s internal control over
        financial reporting includes those policies and procedures that:  \\\\n(i)pertain
        to the maintenance of records that, in reasonable detail, accurately and fairly
        reflect the transactions and dispositions of the Company\\u2019s assets;  \\\\n(ii)provide
        reasonable assurance that transactions are recorded as necessary to permit
        preparation of financial statements in accordance with GAAP, and that the
        Company\\u2019s receipts and expenditures are being made only in accordance
        with authorizations of the Company\\u2019s management and directors; and  \\\\n(iii)provide
        reasonable assurance regarding prevention or timely detection of unauthorized
        acquisition, use, or disposition of the Company\\u2019s assets that could
        have a material effect on the financial statements.  \\\\nManagement, including
        the Company\\u2019s Chief Executive Officer and Chief Financial Officer, does
        not expect that the Company\\u2019s internal controls will prevent or detect
        all errors and all fraud. A control system, no matter how well designed and
        operated, can provide only reasonable, not absolute, assurance that the objectives
        of the control system are met. Further, the design of a control system must
        reflect the fact that there are resource constraints, and the benefits of
        controls must be considered relative to their costs. Because of the inherent
        limitations in all control systems, no evaluation of internal controls can
        provide absolute assurance that all control issues and instances of fraud,
        if any, have been detected. Also, any evaluation of the effectiveness of controls
        in future periods are subject to the risk that those internal controls may
        become inadequate because of changes in business conditions, or that the degree
        of compliance with the policies or procedures may deteriorate.  \\\\nManagement\\u2019s
        Annual Report on Internal Control over Financial Reporting  \\\\nThe Company\\u2019s
        management is responsible for establishing and maintaining adequate internal
        control over financial reporting (as defined in Rule 13a-15(f) under the Exchange
        Act). Management conducted an assessment of the effectiveness of the Company\\u2019s
        internal control over financial reporting based on the criteria set forth
        in Internal Control \\u2013 Integrated Framework issued by the Committee of
        Sponsoring Organizations of the Treadway Commission (2013 framework). Based
        on the Company\\u2019s assessment, management has concluded that its internal
        control over financial reporting was effective as of September30, 2023 to
        provide reasonable assurance regarding the reliability of financial reporting
        and the preparation of financial statements in accordance with GAAP. The Company\\u2019s
        independent registered public accounting firm, Ernst & Young LLP, has issued
        an audit report on the Company\\u2019s internal control over financial reporting,
        which appears in Part II, Item 8 of this Form 10-K.  \\\\nChanges in Internal
        Control over Financial Reporting  \\\\nThere were no changes in the Company\\u2019s
        internal control over financial reporting during the fourth quarter of 2023,
        which were identified in connection with management\\u2019s evaluation required
        by paragraph (d) of Rules 13a-15 and 15d-15 under the Exchange Act, that have
        materially affected, or are reasonably likely to materially affect, the Company\\u2019s
        internal control over financial reporting.  \\\\nItem 9B.Other Information
        \ \\\\nInsider Trading Arrangements  \\\\nOn August 30, 2023, Deirdre O\\u2019Brien,
        the Company\\u2019s Senior Vice President, Retail, and Jeff Williams, the
        Company\\u2019s Chief Operating Officer, each entered into a trading plan
        intended to satisfy the affirmative defense conditions of Rule 10b5-1(c) under
        the Exchange Act. The plans provide for the sale of all shares vested during
        the duration of the plans pursuant to certain equity awards granted to Ms.
        O\\u2019Brien and Mr. Williams, respectively, excluding any shares withheld
        by the Company to satisfy income tax withholding and remittance obligations.
        Ms. O\\u2019Brien\\u2019s plan will expire on October 15, 2024, and Mr. Williams\\u2019
        plan will expire on December 15, 2024, subject to early termination for certain
        specified events set forth in the plans.  \\\\nItem 9C.Disclosure Regarding
        Foreign Jurisdictions that Prevent Inspections  \\\\nNot applicable.  \\\\nPART
        III  \\\\nItem 10.Directors, Executive Officers and Corporate Governance  \\\\nThe
        information required by this Item will be included in the Company\\u2019s
        definitive proxy statement to be filed with the SEC within 120 days after
        September30, 2023, in connection with the solicitation of proxies for the
        Company\\u2019s 2024 annual meeting of shareholders (the \\u201c2024 Proxy
        Statement\\u201d), and is incorporated herein by reference.  \\\\nItem 11.Executive
        Compensation  \\\\nThe information required by this Item will be included
        in the 2024 Proxy Statement, and is incorporated herein by reference.  \\\\nItem
        12.Security Ownership of Certain Beneficial Owners and Management and Related
        Stockholder Matters  \\\\nThe information required by this Item will be included
        in the 2024 Proxy Statement, and is incorporated herein by reference.  \\\\nItem
        13.Certain Relationships and Related Transactions, and Director Independence
        \ \\\\nThe information required by this Item will be included in the 2024
        Proxy Statement, and is incorporated herein by reference.  \\\\nItem 14.Principal
        Accountant Fees and Services  \\\\nThe information required by this Item will
        be included in the 2024 Proxy Statement, and is incorporated herein by reference.
