    body: '{"model": "qwen2.5:3b-instruct", "prompt": "### System:\nYou rewrite a
      financial-analyst''s question into a structured retrieval request.\n\nReturn:\n-
      query_type: \"compare\" ONLY when the analyst asks to contrast the SAME topic
      or metric across multiple companies or multiple time periods (e.g. \"compare
      Apple and Microsoft revenue\", \"how did revenue change from 2022 to 2024\").
      Everything else is \"other\". In particular, checking whether two documents
      agree or match (reconciliation), or asking about a single document or version,
      is \"other\", NOT \"compare\".\n- rewritten_query: a single self-contained question
      with any follow-up references resolved from the conversation. Keep company and
      period words in the text. Do NOT introduce a comparison or any intent the question
      does not already contain.\n- filters: extract a filter ONLY when the question
      explicitly states it. If the question does not state a filter, set it to null.
      Never infer, guess, or copy a default into a filter.\n  - company: list of company
      names exactly as written.\n  - doc_type: list, only if the question names a
      document type (one of: 10-K, 10-Q, 8-K, contract). Do NOT infer a document type
      from the topic \u2014 e.g. \"net sales in 2024\" does NOT imply 10-K, so leave
      doc_type null.\n  - period: list of fiscal years the question states, like \"2024\".
      If no year is stated, set period to null. Never put \"current\" or a version
      word in period.\n  - version: \"current\" unless the question explicitly asks
      for an older or superseded version.\n\n\n### User:\nWhat are the main risk factors?\n\n",
      "options": {}, "stream": false, "format": {"$defs": {"Filters": {"properties":
      {"company": {"anyOf": [{"items": {"type": "string"}, "type": "array"}, {"type":
