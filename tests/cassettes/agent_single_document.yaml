        \"Investment in new business strategies and acquisitions could disrupt the
        Company\u2019s ongoing business, present risks not originally contemplated
        and materially adversely affect the Company\u2019s business, reputation, results
        of operations and financial condition.  \\nThe Company has invested, and in
        the future may invest, in new business strategies or acquisitions. Such endeavors
        may involve significant risks and uncertainties, including distraction of
        management from current operations, greater-than-expected liabilities and
        expenses, economic, political, legal and regulatory challenges associated
        with operating in new businesses, regions or countries, inadequate return
        on capital, potential impairment of tangible and intangible assets, and significant
        write-offs. Investment and acquisition transactions are exposed to additional
        risks, including failing to obtain required regulatory approvals on a timely
        basis or at all, or the imposition of onerous conditions that could delay
        or prevent the Company from completing a transaction or otherwise limit the
        Company\u2019s ability to fully realize the anticipated benefits of a transaction.
        These new ventures are inherently risky and may not be successful. The failure
        of any significant investment could materially adversely affect the Company\u2019s
        business, reputation, results of operations and financial condition.  \\nThe
        Company\u2019s retail stores are subject to numerous risks and uncertainties.  \\nThe
        Company\u2019s retail operations are subject to many factors that pose risks
        and uncertainties and could adversely impact the Company\u2019s business,
        results of operations and financial condition, including macroeconomic factors
        that could have an adverse effect on general retail activity. Other factors
        include the Company\u2019s ability to: manage costs associated with retail
        store construction and operation; manage relationships with existing retail
        partners; manage costs associated with fluctuations in the value of retail
        inventory; and obtain and renew leases in quality retail locations at a reasonable
        cost.  \\nLegal and Regulatory Compliance Risks  \\nThe Company\u2019s business,
        results of operations and financial condition could be adversely impacted
        by unfavorable results of legal proceedings or government investigations.  \\nThe
        Company is subject to various claims, legal proceedings and government investigations
        that have arisen in the ordinary course of business and have not yet been
        fully resolved, and new matters may arise in the future. In addition, agreements
        entered into by the Company sometimes include indemnification provisions which
        can subject the Company to costs and damages in the event of a claim against
        an indemnified third party. The number of claims, legal proceedings and government
        investigations involving the Company, and the alleged magnitude of such claims,
        proceedings and government investigations, has generally increased over time
        and may continue to increase.  \\nThe Company has faced and continues to face
        a significant number of patent claims relating to its cellular-enabled products,
        and new claims may arise in the future, including as a result of new legal
        or regulatory frameworks. For example, technology and other patent-holding
        companies frequently assert their patents and seek royalties and often enter
        into litigation based on allegations of patent infringement or other violations
        of intellectual property rights. The Company is vigorously defending infringement
        actions in courts in several U.S. jurisdictions, as well as internationally
        in various countries. The plaintiffs in these actions frequently seek broad
        injunctive relief and substantial damages.  \\nRegardless of the merit of
        particular claims, defending against litigation or responding to government
        investigations can be expensive, time-consuming and disruptive to the Company\u2019s
        operations. In recognition of these considerations, the Company may enter
        into agreements or other arrangements to settle litigation and resolve such
        challenges. There can be no assurance such agreements can be obtained on acceptable
        terms or that litigation will not occur. These agreements can also significantly
        increase the Company\u2019s cost of sales and operating expenses and require
        the Company to change its business practices and limit the Company\u2019s
        ability to offer certain products and services.  \\nThe outcome of litigation
        or government investigations is inherently uncertain. If one or more legal
        matters were resolved against the Company or an indemnified third party in
        a reporting period for amounts above management\u2019s expectations, the Company\u2019s
        results of operations and financial condition for that reporting period could
        be materially adversely affected. Further, such an outcome can result in significant
        monetary damages, disgorgement of revenue or profits, remedial corporate measures
        or injunctive relief against the Company, and has from time to time required,
        and can in the future require, the Company to change its business practices
        and limit the Company\u2019s ability to develop, manufacture, use, import
        or offer for sale certain products and services, all of which could materially
        adversely affect the Company\u2019s business, reputation, results of operations
        and financial condition.  \\nWhile the Company maintains insurance coverage
        for certain types of claims, such insurance coverage may be insufficient to
        cover all losses or all types of claims that may arise.  \\nThe Company is
        subject to complex and changing laws and regulations worldwide, which exposes
        the Company to potential liabilities, increased costs and other adverse effects
        on the Company\u2019s business.  \\nThe Company\u2019s global operations are
        subject to complex and changing laws and regulations on subjects, including
        antitrust; privacy, data security and data localization; consumer protection;
        advertising, sales, billing and e-commerce; financial services and technology;
        product liability; intellectual property ownership and infringement; digital
        platforms; machine learning and artificial intelligence; internet, telecommunications
        and mobile communications; media, television, film and digital content; availability
        of third-party software applications and services; labor and employment; anticorruption;
        import, export and trade; foreign exchange controls and cash repatriation
        restrictions; anti\u2013money laundering; foreign ownership and investment;
        tax; and environmental, health and safety, including electronic waste, recycling,
        product design and climate change.  \\nCompliance with these laws and regulations
        is onerous and expensive. New and changing laws and regulations can adversely
        affect the Company\u2019s business by increasing the Company\u2019s costs,
        limiting the Company\u2019s ability to offer a product, service or feature
        to customers, imposing changes to the design of the Company\u2019s products
        and services, impacting customer demand for the Company\u2019s products and
        services, and requiring changes to the Company\u2019s business or supply chain.
        New and changing laws and regulations can also create uncertainty about how
        such laws and regulations will be interpreted and applied. These risks and
        costs may increase as the Company\u2019s products and services are introduced
        into specialized applications, including health and financial services, or
        as the Company expands the use of technologies, such as machine learning and
        artificial intelligence features, and must navigate new legal, regulatory
        and ethical considerations relating to such technologies. The Company has
        implemented policies and procedures designed to ensure compliance with applicable
        laws and regulations, but there can be no assurance the Company\u2019s employees,
        contractors or agents will not violate such laws and regulations or the Company\u2019s
        policies and procedures. If the Company is found to have violated laws and
        regulations, it could materially adversely affect the Company\u2019s business,
        reputation, results of operations and financial condition.  \\nRegulatory
        changes and other actions that materially adversely affect the Company\u2019s
        business may be announced with little or no advance notice and the Company
        may not be able to effectively mitigate all adverse impacts from such measures.
        For example, the Company is subject to changing regulations relating to the
        export and import of its products. Although the Company has programs, policies
        and procedures in place that are designed to satisfy regulatory requirements,
        there can be no assurance that such policies and procedures will be effective
        in preventing a violation or a claim of a violation. As a result, the Company\u2019s
        products could be banned, delayed or prohibited from importation, which could
        materially adversely affect the Company\u2019s business, reputation, results
        of operations and financial condition.  \\nExpectations relating to environmental,
        social and governance considerations and related reporting obligations expose
        the Company to potential liabilities, increased costs, reputational harm,
        and other adverse effects on the Company\u2019s business.  \\nMany governments,
        regulators, investors, employees, customers and other stakeholders are increasingly
        focused on environmental, social and governance considerations relating to
        businesses, including climate change and greenhouse gas emissions, human and
        civil rights, and diversity, equity and inclusion. In addition, the Company
        makes statements about its goals and initiatives through its various non-financial
        reports, information provided on its website, press statements and other communications.
        Responding to these environmental, social and governance considerations and
        implementation of the Company\u2019s announced goals and initiatives involves
        risks and uncertainties, requires investments, and depends in part on third-party
        performance or data that is outside the Company\u2019s control. The Company
        cannot guarantee that it will achieve its announced environmental, social
        and governance goals and initiatives. In addition, some stakeholders may disagree
        with the Company\u2019s goals and initiatives. Any failure, or perceived failure,
        by the Company to achieve its goals, further its initiatives, adhere to its
        public statements, comply with federal, state and international environmental,
        social and governance laws and regulations, or meet evolving and varied stakeholder
        expectations and standards could result in legal and regulatory proceedings
        against the Company and materially adversely affect the Company\u2019s business,
        reputation, results of operations, financial condition and stock price.  \\nThe
        technology industry, including, in some instances, the Company, is subject
        to intense media, political and regulatory scrutiny, which exposes the Company
        to increasing regulation, government investigations, legal actions and penalties.  \\nFrom
        time to time, the Company has made changes to its App Store, including actions
        taken in response to litigation, competition, market conditions and legal
        and regulatory requirements. The Company expects to make further business
        changes in the future. For example, in the U.S. the Company has implemented
        changes to how developers communicate with consumers within apps on the U.S.
        storefront of the iOS and iPadOS App Store regarding alternative purchasing
        mechanisms.  \\nThe Company has also implemented changes to iOS, iPadOS, the
        App Store and Safari in the EU as it seeks to comply with the DMA, including
        new business terms and alternative fee structures for iOS and iPadOS apps,
        alternative methods of distribution for iOS and iPadOS apps, alternative payment
        processing for apps across the Company\u2019s operating systems, and additional
        tools and APIs for developers. The Company has also continued to make changes
        to its compliance plan in response to feedback and engagement with the European
        Commission (the \u201cCommission\u201d). Although the Company\u2019s compliance
        plan is intended to address the DMA\u2019s obligations, it has been challenged
        by the Commission and may be challenged further by private litigants. The
        DMA provides for significant fines and penalties for noncompliance, and other
        jurisdictions may seek to require the Company to make changes to its business.
        While the changes introduced by the Company in the EU are intended to reduce
        new privacy and security risks that the DMA poses to EU users, many risks
        will remain.  \\nThe Company is also currently subject to antitrust investigations
        and litigation in various jurisdictions around the world, which can result
        in legal proceedings and claims against the Company that could, individually
        or in the aggregate, have a materially adverse impact on the Company\u2019s
        business, results of operations and financial condition. For example, the
        Company is subject to civil antitrust lawsuits in the U.S. alleging monopolization
        or attempted monopolization in the markets for \u201cperformance smartphones\u201d
        and \u201csmartphones\u201d generally in violation of U.S. antitrust laws.
        In addition, the Company is the subject of investigations in Europe and other
        jurisdictions relating to App Store terms and conditions. If such investigations
        or litigation are resolved against the Company, the Company can be exposed
        to significant fines and may be required to make further changes to its business
        practices, all of which could materially adversely affect the Company\u2019s
        business, reputation, results of operations and financial condition.  \\nFurther,
        the Company has commercial relationships with other companies in the technology
        industry that are or may become subject to investigations and litigation that,
        if resolved against those other companies, could materially adversely affect
        the Company\u2019s commercial relationships with those business partners and
        materially adversely affect the Company\u2019s business, results of operations
        and financial condition. For example, the Company earns revenue from licensing
        arrangements with Google LLC and other companies to offer their search services
        on the Company\u2019s platforms and applications, and certain of these arrangements
        are currently subject to government investigations and legal proceedings.  \\nThere
        can be no assurance the Company\u2019s business will not be materially adversely
        affected, individually or in the aggregate, by the outcomes of such investigations,
        litigation or changes to laws and regulations in the future. Changes to the
        Company\u2019s business practices to comply with new laws and regulations
        or in connection with other legal proceedings can negatively impact the reputation
        of the Company\u2019s products for privacy and security and otherwise adversely
        affect the experience for users of the Company\u2019s products and services,
        and result in harm to the Company\u2019s reputation, loss of competitive advantage,
        poor market acceptance, reduced demand for products and services, and lost
        sales.  \\nThe Company\u2019s business is subject to a variety of U.S. and
        international laws, rules, policies and other obligations regarding data protection.  \\nThe
        Company is subject to an increasing number of federal, state and international
        laws relating to the collection, use, retention, security and transfer of
        various types of personal information. In many cases, these laws apply not
        only to third-party transactions, but also restrict transfers of personal
        information among the Company and its international subsidiaries. Several
        jurisdictions have passed laws in this area, and additional jurisdictions
        are considering imposing additional restrictions or have laws that are pending.
        These laws continue to develop and may be inconsistent from jurisdiction to
        jurisdiction. Complying with emerging and changing requirements causes the
        Company to incur substantial costs and has required and may in the future
        require the Company to change its business practices. Noncompliance could
        result in significant penalties or legal liability.\",\n  \"distance\": 1.0193543434143066,\n  \"citation\":
