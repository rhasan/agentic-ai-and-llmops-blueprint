      storefront of the iOS and iPadOS App Store regarding alternative purchasing
      mechanisms. The Company has also implemented changes to iOS, iPadOS, the App
      Store and Safari\xAE in the European Union (\u201CEU\u201D) as it seeks to comply
      with the Digital Markets Act (the \u201CDMA\u201D), including new business terms
      and alternative fee structures for iOS and iPadOS apps, alternative methods
      of distribution for iOS and iPadOS apps, alternative payment processing for
