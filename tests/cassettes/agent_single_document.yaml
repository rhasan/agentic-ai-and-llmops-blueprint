        {},\n    \"chunk_id\": \"0000320193-24-000123:2\"\n  },\n  \"source\": \"vector\"\n}","type":"text"},{"text":"{\n  \"text\":
        \"The Company\u2019s business is subject to a variety of U.S. and international
        laws, rules, policies and other obligations regarding data protection.  \\nThe
        Company is subject to an increasing number of federal, state and international
        laws relating to the collection, use, retention, security and transfer of
        various types of personal information. In many cases, these laws apply not
        only to third-party transactions, but also restrict transfers of personal
        information among the Company and its international subsidiaries. Several
        jurisdictions have passed laws in this area, and additional jurisdictions
        are considering imposing additional restrictions or have laws that are pending.
        These laws continue to develop and may be inconsistent from jurisdiction to
        jurisdiction. Complying with emerging and changing requirements causes the
        Company to incur substantial costs and has required and may in the future
        require the Company to change its business practices. Noncompliance could
        result in significant penalties or legal liability.  \\nThe Company makes
        statements about its use and disclosure of personal information through its
        privacy policy, information provided on its website, press statements and
        other privacy notices provided to customers. Any failure by the Company to
        comply with these public statements or with federal, state or international
        privacy or data protection laws and regulations could result in inquiries
        or proceedings against the Company by governmental entities or others. In
        addition to reputational impacts, penalties could include ongoing audit requirements
        and significant legal liability.  \\nIn addition to the risks generally relating
        to the collection, use, retention, security and transfer of personal information,
        the Company is also subject to specific obligations relating to information
        considered sensitive under applicable laws, such as health data, financial
        data and biometric data. Health data and financial data are subject to additional
        privacy, security and breach notification requirements, and the Company is
        subject to audit by governmental authorities regarding the Company\u2019s
        compliance with these obligations. If the Company fails to adequately comply
        with these rules and requirements, or if health data or financial data is
        handled in a manner not permitted by law or under the Company\u2019s agreements
        with healthcare or financial institutions, the Company can be subject to litigation
        or government investigations, and can be liable for associated investigatory
        expenses, and can also incur significant fees or fines.  \\nPayment card data
        is also subject to additional requirements. Under payment card rules and obligations,
        if cardholder information is potentially compromised, the Company can be liable
        for associated investigatory expenses and can also incur significant fees
        or fines if the Company fails to follow payment card industry data security
        standards. The Company could also experience a significant increase in payment
        card transaction costs or lose the ability to process payment cards if it
        fails to follow payment card industry data security standards, which could
        materially adversely affect the Company\u2019s business, reputation, results
        of operations and financial condition.  \\nFinancial Risks  \\nThe Company
        expects its quarterly net sales and results of operations to fluctuate.  \\nThe
        Company\u2019s profit margins vary across its products, services, geographic
        segments and distribution channels. For example, the gross margins on the
        Company\u2019s products and services vary significantly and can change over
        time. The Company\u2019s gross margins are subject to volatility and downward
        pressure due to a variety of factors, including: continued industry-wide global
        product pricing pressures and product pricing actions that the Company may
        take in response to such pressures; increased competition; the Company\u2019s
        ability to effectively stimulate demand for certain of its products and services;
        compressed product life cycles; supply shortages; potential increases in the
        cost of components, outside manufacturing services, and developing, acquiring
        and delivering content for the Company\u2019s services; the Company\u2019s
        ability to manage product quality and warranty costs effectively; shifts in
        the mix of products and services, or in the geographic, currency or channel
        mix, including to the extent that regulatory changes require the Company to
        modify its product and service offerings; fluctuations in foreign exchange
        rates; inflation and other macroeconomic pressures; and the introduction of
        new products or services, including new products or services with lower profit
        margins. These and other factors could have a materially adverse impact on
        the Company\u2019s results of operations and financial condition.  \\nThe
        Company has historically experienced higher net sales in its first quarter
        compared to other quarters in its fiscal year due in part to seasonal holiday
        demand. Additionally, new product and service introductions can significantly
        impact net sales, cost of sales and operating expenses. Further, the Company
        generates a significant portion of its net sales from a single product and
        a decline in demand for that product could significantly impact quarterly
        net sales. The Company could also be subject to unexpected developments, such
        as lower-than-anticipated demand for the Company\u2019s products or services,
        issues with new product or service introductions, information technology system
        failures or network disruptions, or failure of one of the Company\u2019s logistics,
        supply or manufacturing partners.  \\nThe Company\u2019s financial performance
        is subject to risks associated with changes in the value of the U.S. dollar
        relative to local currencies.  \\nThe Company\u2019s primary exposure to movements
        in foreign exchange rates relates to non\u2013U.S. dollar\u2013denominated
        sales, cost of sales and operating expenses worldwide. Gross margins on the
        Company\u2019s products in foreign countries and on products that include
        components obtained from foreign suppliers have in the past been adversely
        affected and could in the future be materially adversely affected by foreign
        exchange rate fluctuations.  \\nThe weakening of foreign currencies relative
        to the U.S. dollar adversely affects the U.S. dollar value of the Company\u2019s
        foreign currency\u2013denominated sales and earnings, and generally leads
        the Company to raise international pricing, potentially reducing demand for
        the Company\u2019s products. In some circumstances, for competitive or other
        reasons, the Company may decide not to raise international pricing to offset
        the U.S. dollar\u2019s strengthening, which would adversely affect the U.S.
        dollar value of the gross margins the Company earns on foreign currency\u2013denominated
        sales.  \\nConversely, a strengthening of foreign currencies relative to the
        U.S. dollar, while generally beneficial to the Company\u2019s foreign currency\u2013denominated
        sales and earnings, could cause the Company to reduce international pricing
        or incur losses on its foreign currency derivative instruments, thereby limiting
        the benefit. Additionally, strengthening of foreign currencies may increase
        the Company\u2019s cost of product components denominated in those currencies,
        thus adversely affecting gross margins.  \\nThe Company uses derivative instruments,
        such as foreign currency forward and option contracts, to hedge certain exposures
        to fluctuations in foreign exchange rates. The use of such hedging activities
        may not be effective to offset any, or more than a portion, of the adverse
        financial effects of unfavorable movements in foreign exchange rates over
        the limited time the hedges are in place.  \\nThe Company is exposed to credit
        risk and fluctuations in the values of its investment portfolio.  \\nThe Company\u2019s
        investments can be negatively affected by changes in liquidity, credit deterioration,
        financial results, market and economic conditions, political risk, sovereign
        risk, interest rate fluctuations or other factors. As a result, the value
        and liquidity of the Company\u2019s cash, cash equivalents and marketable
        securities may fluctuate substantially. Although the Company has not realized
        significant losses on its cash, cash equivalents and marketable securities,
        future fluctuations in their value could result in significant losses and
        could have a material adverse impact on the Company\u2019s results of operations
        and financial condition.  \\nThe Company is exposed to credit risk on its
        trade accounts receivable, vendor non-trade receivables and prepayments related
        to long-term supply agreements, and this risk is heightened during periods
        when economic conditions worsen.  \\nThe Company distributes its products
        and certain of its services through third-party cellular network carriers,
        wholesalers, retailers and resellers. The Company also sells its products
        and services directly to small and mid-sized businesses and education, enterprise
        and government customers. A substantial majority of the Company\u2019s outstanding
        trade receivables are not covered by collateral, third-party bank support
        or financing arrangements, or credit insurance, and a significant portion
        of the Company\u2019s trade receivables can be concentrated within cellular
        network carriers or other resellers. The Company\u2019s exposure to credit
        and collectibility risk on its trade receivables is higher in certain international
        markets and its ability to mitigate such risks may be limited. The Company
        also has unsecured vendor non-trade receivables resulting from purchases of
        components by outsourcing partners and other vendors that manufacture subassemblies
        or assemble final products for the Company. In addition, the Company has made
        prepayments associated with long-term supply agreements to secure supply of
        inventory components. As of September28, 2024, the Company\u2019s vendor non-trade
        receivables and prepayments related to long-term supply agreements were concentrated
        among a few individual vendors located primarily in Asia. While the Company
        has procedures to monitor and limit exposure to credit risk on its trade and
        vendor non-trade receivables, as well as long-term prepayments, there can
        be no assurance such procedures will effectively limit its credit risk and
        avoid losses.  \\nThe Company is subject to changes in tax rates, the adoption
        of new U.S. or international tax legislation and exposure to additional tax
        liabilities.  \\nThe Company is subject to taxes in the U.S. and numerous
        foreign jurisdictions, including Ireland and Singapore, where a number of
        the Company\u2019s subsidiaries are organized. Due to economic and political
        conditions, tax laws and tax rates for income taxes and other non-income taxes
        in various jurisdictions may be subject to significant change. For example,
        the Organisation for Economic Co-operation and Development continues to advance
        proposals for modernizing international tax rules, including the introduction
        of global minimum tax standards. The Company\u2019s effective tax rates are
        affected by changes in the mix of earnings in countries with differing statutory
        tax rates, changes in the valuation of deferred tax assets and liabilities,
        the introduction of new taxes, and changes in tax laws or their interpretation.
        The application of tax laws may be uncertain, require significant judgment
        and be subject to differing interpretations.  \\nThe Company is also subject
        to the examination of its tax returns and other tax matters by the U.S. Internal
        Revenue Service and other tax authorities and governmental bodies. The Company
        regularly assesses the likelihood of an adverse outcome resulting from these
        examinations to determine the adequacy of its provision for taxes. There can
        be no assurance as to the outcome of these examinations. If the Company\u2019s
        effective tax rates were to increase, or if the ultimate determination of
        the Company\u2019s taxes owed is for an amount in excess of amounts previously
        accrued, the Company\u2019s business, results of operations and financial
        condition could be materially adversely affected.  \\nGeneral Risks  \\nThe
        price of the Company\u2019s stock is subject to volatility.  \\nThe Company\u2019s
        stock has experienced substantial price volatility in the past and may continue
        to do so in the future. Additionally, the Company, the technology industry
        and the stock market as a whole have, from time to time, experienced extreme
        stock price and volume fluctuations that have affected stock prices in ways
        that may have been unrelated to these companies\u2019 operating performance.
        Price volatility may cause the average price at which the Company repurchases
        its stock in a given period to exceed the stock\u2019s price at a given point
        in time. The Company believes the price of its stock should reflect expectations
        of future growth and profitability. The Company also believes the price of
        its stock should reflect expectations that its cash dividend will continue
        at current levels or grow, and that its current share repurchase program will
        be fully consummated. Future dividends are subject to declaration by the Company\u2019s
        Board of Directors (the \u201cBoard\u201d), and the Company\u2019s share repurchase
        program does not obligate it to acquire any specific number of shares. If
        the Company fails to meet expectations related to future growth, profitability,
        dividends, share repurchases or other market expectations, the price of the
        Company\u2019s stock may decline significantly, which could have a material
        adverse impact on investor confidence and employee retention.  \\nItem 1B.Unresolved
        Staff Comments  \\nNone.  \\nItem 1C.Cybersecurity  \\nThe Company\u2019s
        management, led by its Head of Corporate Information Security, has overall
        responsibility for identifying, assessing and managing any material risks
        from cybersecurity threats. The Company\u2019s Head of Corporate Information
        Security leads a dedicated Information Security team of highly skilled individuals
        with experience across industries that, among other things, develops and distributes
        information security policies, standards and procedures; engages in employee
        cybersecurity training; implements security controls; assesses security risk
        and compliance posture; monitors and responds to security events; and executes
        security testing and assessments. The Company\u2019s Head of Corporate Information
        Security has extensive knowledge and skills gained from over 25 years of experience
        in the cybersecurity industry, including serving in leadership positions at
        other large technology companies and leading the Company\u2019s Information
        Security team since 2016.  \\nThe Company\u2019s Information Security team
        coordinates with teams across the Company to prevent, respond to and manage
        security incidents, and engages third parties, as appropriate, to assess,
        test or otherwise assist with aspects of its security processes and incident
        response. A dedicated Supplier Trust team manages information security risks
        the Company is exposed to through its supplier relationships. The Company
        has processes to log, track, address, and escalate for further assessment
        and report, as appropriate, cybersecurity incidents across the Company and
        its suppliers to senior management and the Audit and Finance Committee (the
        \u201cAudit Committee\u201d) of the Board. The Company\u2019s enterprise risk
        management program is designed to identify, assess, and monitor the Company\u2019s
        business risks, including financial, operational, compliance and reputational
        risks, and reflects management\u2019s assessment of cybersecurity risks.\",\n  \"distance\":
