        \"Form 10-K  \\nFor the Fiscal Year Ended September28, 2024  \\nTABLE OF CONTENTS\",\n  \"distance\":
        0.9901512861251831,\n  \"citation\": {\n    \"natural_id\": \"0000320193-24-000123\",\n    \"company\":
