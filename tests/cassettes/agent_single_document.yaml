        37,\n    \"headers\": {},\n    \"chunk_id\": \"0000320193-24-000123:37\"\n  },\n  \"source\":
        \"vector\"\n}","type":"text"},{"text":"{\n  \"text\": \"(1)The valuation techniques
        used to measure the fair values of the Company\u2019s Level 2 financial instruments,
        which generally have counterparties with high credit ratings, are based on
        quoted market prices or model-driven valuations using significant inputs derived
        from or corroborated by observable market data.  \\n(2)As of September28,
        2024, cash and cash equivalents included $2.6billion held in escrow and restricted
        from general use. These restricted cash and cash equivalents were designated
        to settle the Company\u2019s obligation related to the State Aid Decision
        (refer to Note 7, \u201cIncome Taxes\u201d).  \\n(3)As of September28, 2024
        and September30, 2023, total marketable securities included $13.2billion and
        $13.8 billion, respectively, held in escrow and restricted from general use.
        The September28, 2024 restricted marketable securities were designated to
        settle the Company\u2019s obligation related to the State Aid Decision (refer
        to Note 7, \u201cIncome Taxes\u201d).  \\nAs of September28, 2024, 86% of
        the Company\u2019s non-current marketable debt securities other than mortgage-
        and asset-backed securities had maturities between 1 and 5 years, 10% between
        5 and 10 years, and 4% greater than 10 years. As of September28, 2024, 14%
        of the Company\u2019s non-current mortgage- and asset-backed securities had
        maturities between 1 and 5 years, 9% between 5 and 10 years, and 77% greater
        than 10 years.  \\nThe Company\u2019s investments in marketable debt securities
        have been classified and accounted for as available-for-sale. The Company
        classifies marketable debt securities as either current or non-current based
        on each instrument\u2019s underlying maturity.  \\nDerivative Instruments
        and Hedging  \\nThe Company may use derivative instruments to partially offset
        its business exposure to foreign exchange and interest rate risk. However,
        the Company may choose not to hedge certain exposures for a variety of reasons
        including accounting considerations or the prohibitive economic cost of hedging
        particular exposures. There can be no assurance the hedges will offset more
        than a portion of the financial impact resulting from movements in foreign
        exchange or interest rates.  \\nThe Company classifies cash flows related
        to derivative instruments in the same section of the Consolidated Statements
        of Cash Flows as the items being hedged, which are generally classified as
        operating activities.  \\nForeign Exchange Rate Risk  \\nTo protect gross
        margins from fluctuations in foreign exchange rates, the Company may use forwards,
        options or other instruments, and may designate these instruments as cash
        flow hedges. The Company generally hedges portions of its forecasted foreign
        currency exposure associated with revenue and inventory purchases, typically
        for up to 12 months.  \\nTo protect the Company\u2019s foreign currency\u2013denominated
        term debt or marketable securities from fluctuations in foreign exchange rates,
        the Company may use forwards, cross-currency swaps or other instruments. The
        Company designates these instruments as either cash flow or fair value hedges.
        As of September28, 2024, the maximum length of time over which the Company
        is hedging its exposure to the variability in future cash flows for term debt\u2013related
        foreign currency transactions is 18 years.  \\nThe Company may also use derivative
        instruments that are not designated as accounting hedges to protect gross
        margins from certain fluctuations in foreign exchange rates, as well as to
        offset a portion of the foreign currency gains and losses generated by the
        remeasurement of certain assets and liabilities denominated in non-functional
        currencies.  \\nInterest Rate Risk  \\nTo protect the Company\u2019s term
        debt or marketable securities from fluctuations in interest rates, the Company
        may use interest rate swaps, options or other instruments. The Company designates
        these instruments as either cash flow or fair value hedges.  \\nThe notional
        amounts of the Company\u2019s outstanding derivative instruments as of September28,
        2024 and September30, 2023 were as follows (in millions):\",\n  \"distance\":
